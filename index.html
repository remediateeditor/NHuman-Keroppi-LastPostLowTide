 if(x<0||x>19||y<0||y>9)return false;

  rect(x+6,y+13,20,11,C.salmon);rect(x+9,y+8,3,6,C.salmon);rect(x+21,y+8,3,6,C.salmon);rect(x+9,y+7,3,3,C.paper);rect(x+21,y+7,3,3,C.paper);rect(x+1,y+9,5,12,C.salmon);rect(x+27,y+9,5,12,C.salmon);rect(x+3,y+24,8,3,C.salmon);rect(x+22,y+24,8,3,C.salmon);rect(x+11,y+2,12,4,C.ink);
 }else if(o.type==='box'){
  rect(x+7,y+4,18,22,C.red);rect(x+10,y+1,12,3,C.salmon);rect(x+9,y+10,14,4,C.ink);rect(x+14,y+26,4,6,C.ink);rect(x+10,y+18,12,4,C.paper);
 }else if(o.type==='gull'){
  rect(x+5,y+14,19,9,C.paper);rect(x+19,y+7,8,12,C.paper);rect(x+26,y+13,5,3,C.gold);rect(x+23,y+9,2,2,C.ink);rect(x+9,y+23,2,5,C.gold);rect(x+19,y+23,2,5,C.gold);rect(x+8,y+13,8,6,C.blue);rect(x+3,y+15,4,4,C.paper);
 }else if(o.id==='tide'){
  rect(x+2,y+12,28,17,C.sea);wave(x+3,y+11,26);wave(x+7,y+20,19);
  if(state.delivered.includes('tide'))rect(x+14,y+3,5,5,C.paper);
 }else if(o.id==='lamp'){
  rect(x+12,y+7,9,19,C.gold);rect(x+7,y+26,19,4,C.ink);rect(x+8,y+3,17,14,state.delivered.includes('lamp')?C.paper:C.sea);rect(x+4,y+1,25,3,C.ink);
 }else if(o.id==='echo'){
  rect(x+5,y+1,23,20,C.ink);rect(x+9,y+5,15,11,state.delivered.includes('echo')?C.foam:C.night);line(x+10,y+23,15,C.salmon);
 }
 if(nearby().some(n=>n.id===o.id)&&state.started&&!state.ending){rect(x+14,y-7,5,5,C.foam);}
}}
function draw(){ground();drawObjects();player();rect(0,0,640,43,C.night);txt(TEXT[state.room],18,26,14,C.foam);txt(TEXT.collection,385,26,11,C.salmon);rect(0,368,640,32,C.night);txt(TEXT.motto,18,389,11,C.paper);for(let i=0;i<3;i++){rect(563+i*22,377,14,13,state.delivered.includes(['tide','lamp','echo'][i])?C.foam:C.blue);rect(566+i*22,380,8,7,C.night);}
 if(state.ending){rect(78,127,484,125,C.night);rect(82,131,476,117,C.ink);txt(TEXT[state.ending+'Title'],122,169,23,C.foam);txt(TEXT.stillHere,173,203,13,C.paper);txt(TEXT.possibilities,167,226,12,C.salmon);}
}
function render(){
 const el=id=>document.getElementById(id);el('start').hidden=state.started;el('dialogue').textContent=state.message;
 el('location').textContent=TEXT[state.room];el('inventory').textContent=state.carried?TEXT[state.carried+'Address']:TEXT.empty;el('progress').textContent=`${TEXT.progress}: ${state.delivered.length} / 3`;
 el('restart').hidden=!state.ending;
 const n=nearby();el('interact').textContent=TEXT.interact+(n.length?' · '+TEXT[n[0].name]:'');
 el('interact').disabled=!state.started||!!state.ending;el('inspect').disabled=!state.started||!!state.ending;
 const directions=[['north',0,-1],['east',1,0],['south',0,1],['west',-1,0]].map(([k,dx,dy])=>{const x=state.x+dx,y=state.y+dy,e=exitAt(x,y);return `${TEXT[k]}: ${walkable(state.room,x,y)?e?e.label:TEXT.open:TEXT.wall}`;});
 el('report').textContent=`${TEXT[state.room]}. ${TEXT.column} ${state.x}, ${TEXT.row} ${state.y}. ${directions.join('. ')}. ${TEXT.near}: ${n.length?n.map(o=>TEXT[o.name]).join(', '):TEXT.none}.`;
 for(const b of document.querySelectorAll('[data-dir]'))b.disabled=!state.started||!!state.ending;
 draw();
}
for(const key of ['opening','helpText','accessText','creditText'])document.getElementById(key).textContent=TEXT[key];
document.getElementById('begin').addEventListener('click',start);
document.getElementById('interact').addEventListener('click',()=>interact());
document.getElementById('inspect').addEventListener('click',inspect);
for(const id of ['reset','restart'])document.getElementById(id).addEventListener('click',()=>{reset();document.getElementById('begin').focus();});
for(const b of document.querySelectorAll('[data-dir]'))b.addEventListener('click',()=>move(...b.dataset.dir.split(',').map(Number)));
canvas.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase(),dirs={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
 if(dirs[k]){e.preventDefault();move(...dirs[k]);}else if(['e',' ','enter'].includes(k)){e.preventDefault();state.started?interact():start();}else if(k==='i'){e.preventDefault();inspect();}
});
canvas.addEventListener('pointerdown',e=>{canvas.focus();if(!state.started||state.ending)return;const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*640/r.width/32),y=Math.floor(((e.clientY-r.top)*400/r.height-48)/32);const o=nearby().find(o=>o.x===x&&o.y===y);if(o)interact(o.id);else if(Math.abs(x-state.x)+Math.abs(y-state.y)===1)move(x-state.x,y-state.y);});
const reading=document.getElementById('reading');
for(const [key,value]of Object.entries(TEXT)){const p=document.createElement('p');p.style.whiteSpace='pre-line';p.textContent=value;reading.appendChild(p);}
const walkthrough=document.createElement('p');walkthrough.textContent='Walkthrough: Take the left tray letter to the tide on the strand. Take the middle tray letter to the lighthouse lamp. Take the right tray letter north from the strand to the echo. Return for the final middle-tray letter. Open it at the tide or send it through the red postbox. Taking another tray letter safely swaps your pocket. The first three can be delivered in either available order; the echo path opens after the tide delivery.';reading.appendChild(walkthrough);
window.LastPost={get state(){return state;},rooms,walkable,nearby,objects,move,interact,inspect,start,reset,draw,TEXT};
reset();
